<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Snake Duel - My Plays</title>
  <meta name="description" content="Snake Duel: two players duel head to head in a snake arena where you can also shoot the other snake. Grow to 6 to win. Play on a keyboard, on an iPad, or online with a friend. Free, no account, on My Plays.">
  <meta property="og:title" content="Snake Duel - My Plays">
  <meta property="og:description" content="Two-player competitive snake with shooting. Keyboard, iPad, or online. Grow to 6 cubes to win.">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://myplays.net/snake-duel">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
  <link rel="apple-touch-icon" href="/snake-duel/icon.svg">
  <link rel="manifest" href="/snake-duel/manifest.webmanifest">
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snake Duel">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d2e;
      --surface2:   #252840;
      --primary:    #6c63ff;
      --green:      #43d98c;
      --pink:       #ff6584;
      --yellow:     #ffd166;
      --text:       #e8eaf0;
      --text-muted: #8b8fa8;
      --border:     #2e3154;
      --radius:     12px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body { overscroll-behavior: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100vh;
      height: 100svh;
      height: var(--app-height, 100svh);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #6c63ff0d 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ---- board ---- */
    .stage { position: relative; z-index: 1; width: 100%; display: flex; align-items: center; justify-content: center; }
    canvas {
      display: block; width: 100%; max-width: 100%; height: auto;
      background: #0b0d14; border: 1px solid var(--border); border-radius: var(--radius);
      touch-action: none;
    }

    /* ---- touch pads ---- */
    .pad {
      display: none; width: 100%; align-items: center; justify-content: center;
      padding: 8px 4px; position: relative; z-index: 1; touch-action: none; user-select: none;
    }
    .pad.show { display: flex; }
    .pad.p2 { transform: rotate(180deg); }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 9px;
    }
    .dbtn {
      position: relative;
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      border-radius: 50%; font-size: 1.5rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none;
    }
    .dbtn.up { grid-column: 2; grid-row: 1; }
    .dbtn.left { grid-column: 1; grid-row: 2; }
    .dbtn.right { grid-column: 3; grid-row: 2; }
    .dbtn.down { grid-column: 2; grid-row: 3; }
    .dbtn:active { background: var(--primary); border-color: var(--primary); }
    .pad.p1 .dbtn:active, body.me-green .pad .dbtn:active { background: var(--green); border-color: var(--green); }
    .pad.p2 .dbtn:active, body.me-pink .pad .dbtn:active { background: var(--pink); border-color: var(--pink); }
    /* fire badge: rides on the button matching the snake's current heading */
    .dbtn.fire::after {
      content: '🔥';
      position: absolute; top: -7px; right: -7px;
      font-size: 0.85rem; line-height: 1; background: var(--bg);
      border-radius: 50%; padding: 1px 2px;
      animation: firepulse 0.7s ease-in-out infinite;
    }
    @keyframes firepulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }

    /* ---- layouts ---- */
    body.kbd { justify-content: center; }
    body.kbd .pad { display: none !important; }
    body.twopad { justify-content: space-between; }
    body.onepad { justify-content: space-between; }

    /* ---- portrait lock (touch devices in landscape) ---- */
    .rotate-notice { display: none; }
    @media (orientation: landscape) and (pointer: coarse) {
      .rotate-notice {
        display: flex; position: fixed; inset: 0; z-index: 120;
        background: var(--bg); color: var(--text);
        flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 24px; gap: 14px;
      }
      .rotate-notice .rot-emoji { font-size: 3rem; }
      .rotate-notice .rot-text { font-size: 1.05rem; color: var(--text-muted); max-width: 320px; line-height: 1.5; }
    }

    /* ---- hub link (only on overlays/menus) ---- */
    .hub-link {
      position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 8px; z-index: 70;
      display: none; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none;
      font-size: 0.8rem; font-weight: 600; padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px;
    }
    body.menu .hub-link { display: inline-flex; }
    .hub-link:hover { color: var(--text); border-color: var(--green); }

    /* ---- overlays / modals ---- */
    .overlay {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(10, 12, 20, 0.96);
      display: flex; overflow: auto; padding: 20px 14px;
    }
    .overlay.hidden { display: none; }
    .hidden, [hidden] { display: none !important; }
    .card {
      margin: auto; max-width: 460px; width: 100%;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 26px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px;
    }
    .overlay-title {
      font-size: 1.9rem; font-weight: 900; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--green) 0%, var(--pink) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .overlay-text { color: var(--text-muted); font-size: 0.92rem; line-height: 1.6; }
    .overlay-text.small { font-size: 0.78rem; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-weight: 700; font-size: 0.98rem; padding: 13px 24px; border-radius: 9px;
      border: none; cursor: pointer; min-height: 48px; text-decoration: none; color: #fff;
      background: var(--primary); transition: opacity 150ms; width: 100%; max-width: 300px;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(108,99,255,0.5); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-row { display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: center; }

    .code-box {
      font-size: 2.1rem; font-weight: 900; letter-spacing: 8px; text-align: center;
      width: 100%; max-width: 280px; padding: 14px 10px; border-radius: 12px;
      border: 1px dashed var(--border); background: var(--surface2); color: var(--green);
      caret-color: var(--primary);
    }
    .code-box:not([disabled]) { border-style: solid; color: var(--text); }
    .code-box:focus { outline: none; border-color: var(--primary); }
    .code-box::placeholder { color: var(--text-muted); letter-spacing: 6px; }

    /* speed + accordion inside How to play */
    .speed-control { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 6px; }
    .speed-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .speed-label b { color: var(--text); }
    #speedRange { width: 100%; accent-color: var(--primary); height: 26px; cursor: pointer; }
    .speed-ticks { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--text-muted); }

    .accordion { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    details {
      width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      padding: 0 14px; text-align: left;
    }
    summary {
      cursor: pointer; font-weight: 700; font-size: 0.92rem; padding: 12px 0; list-style: none;
      display: flex; justify-content: space-between; align-items: center;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: '+'; color: var(--text-muted); font-size: 1.2rem; }
    details[open] summary::after { content: '\2212'; }
    .acc-body { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; padding: 0 0 14px; }
    .acc-body b { color: var(--text); }
    .acc-body .k { display: inline-block; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; font-weight: 700; color: var(--text); margin: 0 1px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="rotate-notice" id="rotateNotice">
    <div class="rot-emoji">&#128241;</div>
    <div class="rot-text">Please hold your device in portrait to play Snake Duel.</div>
  </div>

  <a href="/" class="hub-link">&#8592; My Plays</a>

  <!-- Player 2 pad (top, rotated to face the player at the other end) -->
  <div class="pad p2" id="padTop">
    <div class="dpad">
      <button class="dbtn up"    data-dir="up"    aria-label="Player 2 up">&#9650;</button>
      <button class="dbtn left"  data-dir="left"  aria-label="Player 2 left">&#9664;</button>
      <button class="dbtn right" data-dir="right" aria-label="Player 2 right">&#9654;</button>
      <button class="dbtn down"  data-dir="down"  aria-label="Player 2 down">&#9660;</button>
    </div>
  </div>

  <div class="stage">
    <canvas id="board" width="588" height="420" aria-label="Snake Duel board"></canvas>
  </div>

  <!-- Player 1 / local-player pad (bottom) -->
  <div class="pad p1" id="padBottom">
    <div class="dpad">
      <button class="dbtn up"    data-dir="up"    aria-label="up">&#9650;</button>
      <button class="dbtn left"  data-dir="left"  aria-label="left">&#9664;</button>
      <button class="dbtn right" data-dir="right" aria-label="right">&#9654;</button>
      <button class="dbtn down"  data-dir="down"  aria-label="down">&#9660;</button>
    </div>
  </div>

  <!-- Landing: choose how to play -->
  <div class="overlay hidden" id="landingOverlay">
    <div class="card">
      <div class="overlay-title">Snake Duel</div>
      <p class="overlay-text">Two snakes, one arena. Grow to 6 to win, or shoot your rival to pieces.</p>
      <div class="btn-row">
        <button class="btn" id="btn-go-online">Play online</button>
        <button class="btn btn-secondary" id="btn-go-local">Play local</button>
      </div>
      <a href="/" class="btn btn-secondary">Hub</a>
    </div>
  </div>

  <!-- Online setup: invite / join -->
  <div class="overlay hidden" id="onlineOverlay">
    <div class="card">
      <div class="overlay-title">Play online</div>
      <p class="overlay-text" id="onlineLabel">Invite a friend to your game, or join theirs.</p>
      <input id="codeBox" class="code-box" inputmode="numeric" pattern="[0-9]*" maxlength="6" disabled placeholder="------">
      <button class="btn" id="btn-online-go" hidden>Join game</button>
      <div class="btn-row" id="onlineButtons">
        <button class="btn" id="btn-invite">Invite a player</button>
        <button class="btn btn-secondary" id="btn-join">Join a player</button>
      </div>
      <p class="overlay-text small" id="onlineMsg"></p>
      <a href="/" class="btn btn-secondary">Hub</a>
    </div>
  </div>

  <!-- Game over -->
  <div class="overlay hidden" id="resultOverlay">
    <div class="card">
      <div class="overlay-title" id="resultTitle">Result</div>
      <p class="overlay-text" id="resultText"></p>
      <div class="btn-row">
        <button class="btn" id="btn-rematch">Play again</button>
        <button class="btn btn-secondary" id="btn-howto">How to play</button>
        <a href="/" class="btn btn-secondary">Hub</a>
      </div>
    </div>
  </div>

  <!-- How to play -->
  <div class="overlay hidden" id="howtoOverlay">
    <div class="card">
      <div class="overlay-title">How to play</div>

      <div class="accordion" id="howtoKbd">
        <details open>
          <summary>Game rules</summary>
          <div class="acc-body" id="rulesTextKbd"></div>
        </details>
        <details>
          <summary>Keyboard shortcuts</summary>
          <div class="acc-body" id="keysText"></div>
        </details>
      </div>

      <div id="howtoTouch" class="hidden">
        <p class="overlay-text" id="rulesTextTouch"></p>
      </div>

      <div class="speed-control">
        <label class="speed-label" for="speedRange">Snake speed: <b id="speedName">Normal</b></label>
        <input type="range" id="speedRange" min="1" max="5" step="1" value="2" aria-label="Snake speed">
        <div class="speed-ticks"><span>Relaxed</span><span>Turbo</span></div>
      </div>

      <button class="btn" id="btn-howto-back">Back</button>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="/snake-duel/engine.js"></script>
  <script>
  (function () {
    'use strict';
    var Engine = window.SnakeDuelEngine;
    var body = document.body;
    var canvas = document.getElementById('board');
    var ctx = canvas.getContext('2d');
    var stage = document.querySelector('.stage');

    var COLS = 21, ROWS = 15, CELL = 28;
    var COLORS = { green: '#43d98c', greenHead: '#7ff0b6', pink: '#ff6584', pinkHead: '#ff9bb1', food: '#ffd166', shot: '#ffffff' };
    var INV = { up: 'down', down: 'up', left: 'right', right: 'left' };
    var DIRS = Engine.DIRS;

    var SPEEDS = [
      null,
      { name: 'Relaxed', snake: 175, proj: 58 },
      { name: 'Normal',  snake: 130, proj: 44 },
      { name: 'Fast',    snake: 100, proj: 34 },
      { name: 'Faster',  snake: 75,  proj: 26 },
      { name: 'Turbo',   snake: 55,  proj: 22 }
    ];
    var speedLevel = 2;
    var SNAKE_MS = SPEEDS[speedLevel].snake;
    var PROJ_MS = SPEEDS[speedLevel].proj;

    // mode: 'local' (two players, one device) | 'host' (online, you are P1) | 'client' (online, you are P2)
    var mode = 'local';
    var localPlayer = 1;
    var game = null, remoteState = null;
    var running = false, paused = false;
    var lastSnakeStep = 0, lastProjStep = 0, rafId = null;
    var net = { peer: null, conn: null };

    // device
    var isTouch = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
    function isPhone() { return Math.min(window.innerWidth, window.innerHeight) < 600; }

    var padTop = document.getElementById('padTop');
    var padBottom = document.getElementById('padBottom');

    // ---- sizing ----
    function appHeight() { return (window.visualViewport && window.visualViewport.height) || window.innerHeight; }
    function fitCanvas() {
      var dpr = window.devicePixelRatio || 1;
      var cssW = canvas.clientWidth || COLS * 28;
      var w = Math.max(220, Math.round(cssW * dpr));
      canvas.width = w; canvas.height = Math.round(w * ROWS / COLS);
      CELL = canvas.width / COLS;
    }
    function fitBoard() {
      var appH = appHeight(), appW = window.innerWidth;
      var twopad = body.classList.contains('twopad');
      var onepad = body.classList.contains('onepad');
      var cs = getComputedStyle(body);
      var safe = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
      var padH = (twopad || onepad) ? (padBottom.getBoundingClientRect().height || 188) : 0;
      var reserve = twopad ? padH * 2 + safe + 8 : onepad ? padH + safe + 8 : safe + 12;
      var availH = Math.max(160, appH - reserve);
      var availW = window.innerWidth * (body.classList.contains('kbd') ? 0.985 : 0.96);
      var boardW = Math.max(200, Math.min(availW, availH * (COLS / ROWS)));
      stage.style.maxWidth = Math.round(boardW) + 'px';
      stage.style.width = Math.round(boardW) + 'px';
      fitCanvas();
      if (!running) draw(remoteState || null);
    }
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', Math.round(appHeight()) + 'px');
      fitBoard();
    }
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 250); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);

    function setupLayout() {
      body.classList.remove('kbd', 'twopad', 'onepad', 'me-green', 'me-pink');
      padTop.classList.remove('show'); padBottom.classList.remove('show');
      if (!isTouch) {
        body.classList.add('kbd');
      } else if (mode === 'local') {
        body.classList.add('twopad');
        padTop.classList.add('show'); padBottom.classList.add('show');
      } else {
        body.classList.add('onepad');
        padBottom.classList.add('show');
        body.classList.add(localPlayer === 2 ? 'me-pink' : 'me-green');
      }
      fitBoard();
    }

    // ---- input ----
    function inputDir(player, dir) { if (mode === 'client') netSend({ t: 'dir', dir: dir }); else if (game) game.setDir(player, dir); }
    function inputFire(player) { if (mode === 'client') netSend({ t: 'fire' }); else if (game) game.fire(player); }
    function padPlayer(pos) { return mode === 'local' ? (pos === 'bottom' ? 1 : 2) : localPlayer; }
    function padInvert(pos) { return mode === 'local' && pos === 'top'; }

    function dirName(v) { if (!v) return null; for (var k in DIRS) { if (DIRS[k].x === v.x && DIRS[k].y === v.y) return k; } return null; }
    function currentDirName(player) {
      if (mode === 'client') {
        var rs = remoteState && remoteState.snakes && remoteState.snakes[player - 1];
        if (!rs || !rs.cells || rs.cells.length < 2) return null;
        return dirName({ x: rs.cells[0].x - rs.cells[1].x, y: rs.cells[0].y - rs.cells[1].y });
      }
      if (game && game.snakes[player - 1]) return dirName(game.snakes[player - 1].dir);
      return null;
    }
    function resolvedDir(pos, base) { return padInvert(pos) ? INV[base] : base; }

    function bindPad(padEl, pos) {
      padEl.querySelectorAll('[data-dir]').forEach(function (btn) {
        btn.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          if (!running || paused) return;
          var player = padPlayer(pos);
          var dir = resolvedDir(pos, btn.getAttribute('data-dir'));
          if (currentDirName(player) === dir) inputFire(player); else inputDir(player, dir);
        });
      });
    }
    bindPad(padTop, 'top'); bindPad(padBottom, 'bottom');

    function updateBadges() {
      [['top', padTop], ['bottom', padBottom]].forEach(function (pair) {
        var pos = pair[0], pad = pair[1];
        if (!pad.classList.contains('show')) return;
        var cur = currentDirName(padPlayer(pos));
        pad.querySelectorAll('[data-dir]').forEach(function (btn) {
          btn.classList.toggle('fire', resolvedDir(pos, btn.getAttribute('data-dir')) === cur);
        });
      });
    }

    // keyboard
    var LOCAL_KEYMAP = { KeyW: [1, 'up'], KeyS: [1, 'down'], KeyA: [1, 'left'], KeyD: [1, 'right'], ArrowUp: [2, 'up'], ArrowDown: [2, 'down'], ArrowLeft: [2, 'left'], ArrowRight: [2, 'right'] };
    var LOCAL_FIRE = { Space: 1, Enter: 2 };
    var UNI_DIR = { KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right', ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    var PREVENT = { Space: 1, Enter: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1 };
    window.addEventListener('keydown', function (e) {
      if (PREVENT[e.code] && document.activeElement && document.activeElement.tagName !== 'INPUT') e.preventDefault();
      if (e.code === 'KeyP' && (mode === 'local' || mode === 'host')) { if (running) paused = !paused; return; }
      if (!running || paused) return;
      if (mode === 'local') {
        if (LOCAL_KEYMAP[e.code]) game.setDir(LOCAL_KEYMAP[e.code][0], LOCAL_KEYMAP[e.code][1]);
        else if (LOCAL_FIRE[e.code]) game.fire(LOCAL_FIRE[e.code]);
      } else {
        if (UNI_DIR[e.code]) inputDir(localPlayer, UNI_DIR[e.code]);
        else if (e.code === 'Space' || e.code === 'Enter') inputFire(localPlayer);
      }
    });

    // ---- rendering ----
    function draw(state) {
      ctx.fillStyle = '#0b0d14'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#171a26'; ctx.lineWidth = 1;
      for (var x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke(); }
      for (var y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke(); }
      if (!state) return;
      (state.food || []).forEach(function (f) { ctx.fillStyle = COLORS.food; roundCell(f.x, f.y, 6); });
      if (state.snakes) { drawSnake(state.snakes[0], COLORS.green, COLORS.greenHead); drawSnake(state.snakes[1], COLORS.pink, COLORS.pinkHead); }
      (state.projectiles || []).forEach(function (p) {
        ctx.fillStyle = COLORS.shot; ctx.beginPath();
        ctx.arc(p.pos.x * CELL + CELL / 2, p.pos.y * CELL + CELL / 2, CELL / 5, 0, Math.PI * 2); ctx.fill();
      });
    }
    function roundCell(cx, cy, r) {
      var px = cx * CELL + 2, py = cy * CELL + 2, s = CELL - 4;
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(px, py, s, s, r); else ctx.rect(px, py, s, s); ctx.fill();
    }
    function drawSnake(snake, bodyColor, headColor) {
      if (!snake || !snake.cells.length) return;
      snake.cells.forEach(function (c, i) { ctx.fillStyle = i === 0 ? headColor : bodyColor; roundCell(c.x, c.y, i === 0 ? 8 : 5); });
    }

    // ---- loops ----
    function engineStep(ts) {
      if (!running) return;
      rafId = requestAnimationFrame(engineStep);
      if (paused) { draw(game); return; }
      if (!lastSnakeStep) { lastSnakeStep = ts; lastProjStep = ts; }
      var changed = false;
      if (ts - lastProjStep >= PROJ_MS) { game.tickProjectiles(); lastProjStep = ts; changed = true; }
      if (ts - lastSnakeStep >= SNAKE_MS) { game.tickSnakes(); lastSnakeStep = ts; changed = true; }
      draw(game); updateBadges();
      if (mode === 'host' && changed) netSend({ t: 'state', s: game.snapshot() });
      if (game.status !== 'playing') { if (mode === 'host') netSend({ t: 'state', s: game.snapshot() }); endGame(game.status); }
    }
    function clientStep() {
      if (!running) return;
      rafId = requestAnimationFrame(clientStep);
      draw(remoteState); updateBadges();
      if (remoteState && remoteState.status && remoteState.status !== 'playing') endGame(remoteState.status);
    }

    function applySpeed() { var s = SPEEDS[speedLevel] || SPEEDS[2]; SNAKE_MS = s.snake; PROJ_MS = s.proj; }

    function startEngineGame(m) {
      applySpeed();
      mode = m; localPlayer = (m === 'client') ? 2 : 1;
      game = Engine.createGame({ config: { cols: COLS, rows: ROWS } });
      remoteState = null; running = true; paused = false; lastSnakeStep = 0; lastProjStep = 0;
      body.classList.remove('menu'); hideOverlays(); setupLayout();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(engineStep);
      if (m === 'host') netSend({ t: 'state', s: game.snapshot() });
    }
    function startLocal() { startEngineGame('local'); }
    function startHost() { startEngineGame('host'); }
    function beginClient() {
      mode = 'client'; localPlayer = 2; running = true; paused = false;
      body.classList.remove('menu'); hideOverlays(); setupLayout();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(clientStep);
    }

    function endGame(status) {
      if (!running) return;
      running = false; if (rafId) cancelAnimationFrame(rafId);
      var msg = { p1: 'Green wins!', p2: 'Pink wins!', tie: "It's a tie!" };
      resultTitle.textContent = msg[status] || 'Result';
      if (status === 'tie') resultText.textContent = 'Both players went out at the same moment. Line up a rematch.';
      else if (status === 'p1') resultText.textContent = 'Green reached the win or left Pink with nothing.';
      else resultText.textContent = 'Pink reached the win or left Green with nothing.';
      showOverlay('resultOverlay');
    }

    // ---- overlays ----
    var landingOverlay = document.getElementById('landingOverlay');
    var onlineOverlay = document.getElementById('onlineOverlay');
    var resultOverlay = document.getElementById('resultOverlay');
    var howtoOverlay = document.getElementById('howtoOverlay');
    var resultTitle = document.getElementById('resultTitle');
    var resultText = document.getElementById('resultText');

    function hideOverlays() { [landingOverlay, onlineOverlay, resultOverlay, howtoOverlay].forEach(function (o) { o.classList.add('hidden'); }); }
    function showOverlay(id) {
      hideOverlays();
      document.getElementById(id).classList.remove('hidden');
      body.classList.add('menu');
    }

    function showLanding() {
      document.getElementById('btn-go-local').style.display = isPhone() ? 'none' : '';
      showOverlay('landingOverlay');
    }
    function showOnline() {
      resetOnlineUi();
      showOverlay('onlineOverlay');
    }

    // ---- How to play ----
    var RULES = 'Each snake starts at 3 cubes. Eat food to grow, reach 6 cubes to win. Shoot the other snake to blow off a cube, a head shot pushes their head back, any other hit closes the gap. Hit a wall, the other snake, or yourself and you lose. Two heads colliding is a tie.';
    document.getElementById('rulesTextKbd').textContent = RULES;
    document.getElementById('rulesTextTouch').textContent = RULES;
    function showHowto() {
      var keyboard = !isTouch;
      document.getElementById('howtoKbd').classList.toggle('hidden', !keyboard);
      document.getElementById('howtoTouch').classList.toggle('hidden', keyboard);
      if (keyboard) {
        document.getElementById('keysText').innerHTML = (mode === 'local')
          ? 'Player 1 - Green: move <span class="k">W</span> <span class="k">A</span> <span class="k">S</span> <span class="k">D</span>, fire <span class="k">Space</span>.<br>Player 2 - Pink: move with the <span class="k">Arrow keys</span>, fire <span class="k">Enter</span>.'
          : 'Move with <span class="k">W</span> <span class="k">A</span> <span class="k">S</span> <span class="k">D</span> or the <span class="k">Arrow keys</span>. Fire with <span class="k">Space</span> or <span class="k">Enter</span>.';
      }
      showOverlay('howtoOverlay');
    }

    // ---- networking (PeerJS, free peer to peer) ----
    var PREFIX = 'myplays-snakeduel-';
    var codeBox = document.getElementById('codeBox');
    var onlineLabel = document.getElementById('onlineLabel');
    var onlineMsg = document.getElementById('onlineMsg');
    var onlineButtons = document.getElementById('onlineButtons');
    var onlineGoBtn = document.getElementById('btn-online-go');

    function netSend(obj) { if (net.conn && net.conn.open) { try { net.conn.send(obj); } catch (e) {} } }
    function genCode() { var s = ''; for (var i = 0; i < 6; i++) s += Math.floor(Math.random() * 10); return s; }

    function resetOnlineUi() {
      closePeer();
      onlineLabel.textContent = 'Invite a friend to your game, or join theirs.';
      codeBox.value = ''; codeBox.setAttribute('disabled', ''); codeBox.placeholder = '------';
      onlineButtons.classList.remove('hidden'); onlineGoBtn.hidden = true; onlineMsg.textContent = '';
    }
    function closePeer() { try { if (net.peer) net.peer.destroy(); } catch (e) {} net.peer = null; net.conn = null; }

    function inviteHost() {
      if (!window.Peer) { onlineMsg.textContent = 'Online is unavailable right now. Please try again later.'; return; }
      onlineButtons.classList.add('hidden'); onlineGoBtn.hidden = true;
      onlineLabel.textContent = 'Tell your friend to join with this code.';
      codeBox.setAttribute('disabled', ''); codeBox.value = '......';
      onlineMsg.textContent = 'Setting up your room...';
      var attempts = 0;
      (function tryHost() {
        var code = genCode();
        var peer = new Peer(PREFIX + code); net.peer = peer;
        peer.on('open', function () { codeBox.value = code; onlineMsg.textContent = 'Waiting for your friend to join...'; });
        peer.on('connection', function (conn) {
          net.conn = conn;
          conn.on('data', handleHostData);
          conn.on('open', function () { onlineMsg.textContent = 'Friend joined. Starting...'; startHost(); });
          conn.on('close', function () { if (running && mode === 'host') endGame('p1'); });
        });
        peer.on('error', function (err) {
          if (err && err.type === 'unavailable-id' && attempts < 6) { attempts++; try { peer.destroy(); } catch (e) {} tryHost(); return; }
          onlineMsg.textContent = 'Could not start the room (' + (err && err.type) + '). Tap Invite a player to retry.';
          onlineButtons.classList.remove('hidden');
        });
      })();
    }

    function joinMode() {
      onlineButtons.classList.add('hidden');
      onlineLabel.textContent = 'Enter the code you got from your friend.';
      codeBox.removeAttribute('disabled'); codeBox.value = ''; codeBox.placeholder = '000000';
      onlineGoBtn.hidden = false; onlineMsg.textContent = '';
      setTimeout(function () { codeBox.focus(); }, 50);
    }

    function connectClient() {
      if (!window.Peer) { onlineMsg.textContent = 'Online is unavailable right now.'; return; }
      var code = (codeBox.value || '').replace(/\D/g, '');
      if (code.length < 6) { onlineMsg.textContent = 'Enter the 6 digit code.'; return; }
      onlineMsg.textContent = 'Connecting...';
      var peer = new Peer(); net.peer = peer;
      peer.on('open', function () {
        var conn = peer.connect(PREFIX + code, { reliable: true }); net.conn = conn;
        conn.on('open', function () { onlineMsg.textContent = 'Connected. Waiting for the game to start...'; });
        conn.on('data', handleClientData);
        conn.on('close', function () { if (running && mode === 'client') endGame('p2'); });
        setTimeout(function () { if (!conn.open) onlineMsg.textContent = 'No response yet. Check the code and try again.'; }, 9000);
      });
      peer.on('error', function (err) { onlineMsg.textContent = 'Connection problem (' + (err && err.type) + '). Check the code.'; });
    }

    function handleHostData(d) { if (!d) return; if (d.t === 'dir') { if (game) game.setDir(2, d.dir); } else if (d.t === 'fire') { if (game) game.fire(2); } else if (d.t === 'rematch') startHost(); }
    function handleClientData(d) { if (!d) return; if (d.t === 'state') { remoteState = d.s; if (!running) beginClient(); } }

    // ---- speed ----
    var speedRange = document.getElementById('speedRange');
    var speedName = document.getElementById('speedName');
    function updateSpeedLabel() {
      speedLevel = parseInt(speedRange.value, 10) || 2;
      speedName.textContent = (SPEEDS[speedLevel] || SPEEDS[2]).name;
      try { localStorage.setItem('sd_speed', String(speedLevel)); } catch (e) {}
    }
    try { var sv = parseInt(localStorage.getItem('sd_speed'), 10); if (sv >= 1 && sv <= 5) speedRange.value = String(sv); } catch (e) {}
    speedRange.addEventListener('input', updateSpeedLabel);
    updateSpeedLabel();

    // ---- fullscreen on first interaction (where supported) ----
    var fsTried = false;
    function tryFullscreen() {
      if (fsTried) return; fsTried = true;
      var docEl = document.documentElement;
      var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      if (standalone) return;
      var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
      if (req) { try { req.call(docEl); } catch (e) {} }
    }
    window.addEventListener('pointerdown', tryFullscreen, { once: true });
    window.addEventListener('keydown', tryFullscreen, { once: true });

    // ---- portrait lock ----
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(function () {}); } catch (e) {}
    var landscapeMQ = window.matchMedia('(orientation: landscape) and (pointer: coarse)');
    var autoPaused = false;
    function checkOrientation() {
      if (landscapeMQ.matches) { if (running && !paused && (mode === 'local' || mode === 'host')) { paused = true; autoPaused = true; } }
      else if (autoPaused) { paused = false; autoPaused = false; }
    }
    if (landscapeMQ.addEventListener) landscapeMQ.addEventListener('change', checkOrientation);
    else if (landscapeMQ.addListener) landscapeMQ.addListener(checkOrientation);

    // ---- wiring ----
    document.getElementById('btn-go-online').addEventListener('click', showOnline);
    document.getElementById('btn-go-local').addEventListener('click', startLocal);
    document.getElementById('btn-invite').addEventListener('click', inviteHost);
    document.getElementById('btn-join').addEventListener('click', joinMode);
    document.getElementById('btn-online-go').addEventListener('click', connectClient);
    codeBox.addEventListener('input', function () { codeBox.value = codeBox.value.replace(/\D/g, '').slice(0, 6); });
    codeBox.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !codeBox.disabled) connectClient(); });

    document.getElementById('btn-rematch').addEventListener('click', function () {
      if (mode === 'client') { netSend({ t: 'rematch' }); resultText.textContent = 'Asking the host for a rematch...'; }
      else if (mode === 'host') startHost();
      else startLocal();
    });
    document.getElementById('btn-howto').addEventListener('click', showHowto);
    document.getElementById('btn-howto-back').addEventListener('click', function () { showOverlay('resultOverlay'); });

    // ---- routing ----
    function start() {
      setAppHeight();
      var params = new URLSearchParams(location.search);
      var m = params.get('mode');
      if (m === 'local' && !isPhone()) startLocal();
      else if (m === 'online') showOnline();
      else if (m === 'local' && isPhone()) showOnline();
      else showLanding();
    }
    start();
  })();
  </script>
</body>
</html>
