<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Plays - Free Browser Games</title>
  <meta name="description" content="My Plays: free skill-based browser games. Play Word Blitz, Snake Sprint, Memory Match and more. No account, no download, play instantly.">
  <meta property="og:title" content="My Plays - Free Browser Games">
  <meta property="og:description" content="Free skill-based browser games. Play instantly, no account needed.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://myplays.net/og-images/hub.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Plays - Free Browser Games">
  <meta name="twitter:description" content="Free skill-based browser games. Play instantly, no account needed.">
  <meta name="twitter:image" content="https://myplays.net/og-images/hub.svg">
  <link rel="canonical" href="https://myplays.net/">
  <meta property="og:url" content="https://myplays.net/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
    input, textarea { user-select: text; -webkit-user-select: text; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d2e;
      --surface2:   #252840;
      --primary:    #6c63ff;
      --accent:     #ff6584;
      --text:       #e8eaf0;
      --text-muted: #8b8fa8;
      --border:     #2e3154;
      --radius:     14px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #6c63ff0d 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 56px 20px 16px;
    }

    .brand-logo {
      font-size: clamp(2.4rem, 7vw, 3.6rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      line-height: 1.1;
    }

    .brand-tag {
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .badge-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 60px;
      width: 100%;
    }

    .section-heading {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 20px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      transition: transform 150ms cubic-bezier(0.2,0,0,1),
                  box-shadow 150ms cubic-bezier(0.2,0,0,1),
                  border-color 150ms;
      position: relative;
      overflow: hidden;
    }

    .game-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--card-accent, var(--primary));
    }

    .game-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
      border-color: var(--card-accent, var(--primary));
    }

    .game-card:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(108,99,255,0.5);
    }

    .card-emoji { font-size: 2.8rem; line-height: 1; }

    .card-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .card-blurb {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.55;
      flex: 1;
    }

    .card-play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--card-accent, var(--primary));
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 11px 20px;
      border-radius: 8px;
      margin-top: 4px;
      transition: opacity 150ms;
      min-height: 44px;
    }

    .game-card:hover .card-play-btn { opacity: 0.85; }

    .card-btn-row { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
    .card-btn-row .card-play-btn { margin-top: 0; flex: 1 1 110px; }
    .card-play-btn.ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .card-play-btn:hover { opacity: 0.88; }
    .game-card.no-link { cursor: default; }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px 20px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    header { animation: fade-up 250ms cubic-bezier(0,0,0,1) both; }
    .games-grid { animation: fade-up 250ms cubic-bezier(0,0,0,1) 80ms both; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <script src="/analytics.js" defer></script>
  <script src="/no-zoom.js" defer></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "My Plays",
    "url": "https://myplays.net/",
    "description": "Free skill-based browser games. Play instantly, no account needed.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://myplays.net/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>
<body>
  <header>
    <div class="brand-logo">🎮 My Plays</div>
    <p class="brand-tag">Free skill-based browser games. Play instantly.</p>
    <div class="badge-row">
      <span class="badge">No account needed</span>
      <span class="badge">Free forever</span>
      <span class="badge">No tracking</span>
    </div>
  </header>

  <main>
    <div class="section-heading">Choose a game</div>
    <div class="games-grid" id="gamesGrid"></div>
  </main>

  <footer>
    My Plays - free browser games, skill-based, privacy-safe.
  </footer>

  <script>
  (async () => {
    const grid = document.getElementById('gamesGrid');
    let games;
    try {
      const r = await fetch('/games.json');
      games = await r.json();
    } catch (_) {
      games = [];
    }

    if (!games.length) {
      grid.innerHTML = '<p style="color:var(--text-muted)">Games loading...</p>';
      return;
    }

    grid.innerHTML = games.map(g => {
      const inner = `
        <div class="card-emoji">${g.emoji}</div>
        <div class="card-title">${g.title}</div>
        <div class="card-blurb">${g.blurb}</div>`;
      if (Array.isArray(g.modes) && g.modes.length) {
        const small = Math.min(window.innerWidth, window.innerHeight) < 600;
        const MODE_LABELS = { online: 'Play online', ai: 'Play vs computer', local: '2 players (same device)' };
        let modes = g.modes;
        if (small) modes = modes.filter(m => m !== 'local');
        if (!modes.length) modes = g.modes.slice(0, 1);
        const btns = modes.map((m, i) =>
          `<a class="card-play-btn${i > 0 ? ' ghost' : ''}" href="${g.route}?mode=${m}">${MODE_LABELS[m] || ('Play ' + m)}</a>`
        ).join('');
        return `<div class="game-card no-link" style="--card-accent:${g.accent}" data-game-id="${g.id}">${inner}<div class="card-btn-row">${btns}</div></div>`;
      }
      return `<a class="game-card" href="${g.route}" style="--card-accent:${g.accent}" data-game-id="${g.id}">${inner}<div class="card-play-btn">Play Now &#8594;</div></a>`;
    }).join('');
  })();
  </script>
</body>
</html>
