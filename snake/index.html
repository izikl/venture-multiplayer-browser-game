<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Snake Sprint - My Plays</title>
  <meta name="description" content="Play Snake Sprint - eat pellets, grow longer, avoid yourself. Free classic arcade skill game on My Plays.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d2e;
      --surface2:   #252840;
      --primary:    #6c63ff;
      --green:      #43d98c;
      --yellow:     #ffd166;
      --red:        #ff6b6b;
      --text:       #e8eaf0;
      --text-muted: #8b8fa8;
      --border:     #2e3154;
      --radius:     12px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 12px 32px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #43d98c0a 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Hub nav */
    .hub-header {
      position: relative; z-index: 1;
      width: 100%; max-width: 540px;
      text-align: left;
      padding: 16px 0 0;
    }
    .hub-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-muted); text-decoration: none;
      font-size: 0.85rem; font-weight: 600;
      padding: 8px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
      transition: color 0.15s, border-color 0.15s;
      min-height: 44px;
    }
    .hub-link:hover { color: var(--text); border-color: var(--green); }
    .hub-link:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(67,217,140,0.4); }

    /* Game wrapper */
    #game-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-top: 16px;
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 4px;
    }
    .logo h1 {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--green), #a8ff78);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .logo p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    /* Score bar */
    .score-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
    }
    .score-item { text-align: center; }
    .score-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
    }
    .score-value {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--yellow);
      font-variant-numeric: tabular-nums;
    }
    .score-value.green { color: var(--green); }

    /* Canvas */
    #canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 500px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      image-rendering: pixelated;
      touch-action: none;
    }

    /* Overlay screens */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15,17,23,0.88);
      backdrop-filter: blur(4px);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    .overlay.hidden { display: none; }

    .overlay-emoji { font-size: 3rem; }
    .overlay-title { font-size: 1.6rem; font-weight: 900; }
    .overlay-sub { color: var(--text-muted); font-size: 0.9rem; }
    .overlay-score { font-size: 2rem; font-weight: 900; color: var(--yellow); }

    /* Buttons */
    .btn {
      font-family: var(--font);
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      padding: 13px 28px;
      transition: transform 0.1s, opacity 0.15s;
      min-height: 44px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-green { background: var(--green); color: #0a2016; }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn:hover:not(:disabled) { opacity: 0.88; }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(67,217,140,0.4); }

    .btn-row { display: flex; gap: 10px; }

    /* Controls hint */
    .controls-hint {
      color: var(--text-muted);
      font-size: 0.78rem;
      text-align: center;
      line-height: 1.5;
    }

    /* Speed indicator */
    .level-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #game-wrap { animation: fade-up 200ms cubic-bezier(0,0,0,1) both; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* On short screens, compact the chrome so the board always fits. */
    @media (max-height: 600px) {
      .logo p { display: none; }
      .logo h1 { font-size: 1.4rem; }
      .logo { margin-bottom: 0; }
      #game-wrap { gap: 8px; padding-top: 8px; }
      .hub-header { padding-top: 8px; }
      .score-bar { padding: 8px 16px; }
      .score-value { font-size: 1.1rem; }
      body { padding-bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="hub-header">
    <a href="/" class="hub-link">&#8592; My Plays</a>
  </div>

  <div id="game-wrap">
    <div class="logo">
      <h1>🐍 Snake Sprint</h1>
      <p>Eat pellets, grow longer, avoid yourself</p>
    </div>

    <div class="score-bar">
      <div class="score-item">
        <div class="score-label">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-item">
        <div class="score-label">Level</div>
        <div class="score-value green" id="level">1</div>
      </div>
      <div class="score-item">
        <div class="score-label">Best</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="canvas" width="500" height="500" role="img" aria-label="Snake game board"></canvas>

      <!-- Start overlay -->
      <div class="overlay" id="overlay-start">
        <div class="overlay-emoji">🐍</div>
        <div class="overlay-title">Snake Sprint</div>
        <div class="overlay-sub">Eat pellets to grow. Avoid walls and yourself.<br>Speed increases every 5 pellets.</div>
        <button class="btn btn-green" id="btn-start">Play</button>
        <div class="controls-hint">Arrow keys or WASD to move. Swipe on mobile.</div>
      </div>

      <!-- Game over overlay -->
      <div class="overlay hidden" id="overlay-gameover">
        <div class="overlay-emoji">💥</div>
        <div class="overlay-title">Game Over</div>
        <div class="overlay-score" id="final-score">0</div>
        <div class="overlay-sub" id="gameover-sub"></div>
        <div class="btn-row">
          <button class="btn btn-green" id="btn-replay">Play Again</button>
          <a href="/" class="btn btn-secondary">Hub</a>
        </div>
      </div>
    </div>
  </div>

  <script>
  'use strict';

  const COLS = 25, ROWS = 25, CELL = 20; // 500x500 canvas
  const INITIAL_INTERVAL = 140; // ms per tick
  const SPEED_STEP = 8;         // ms faster per level
  const PELLETS_PER_LEVEL = 5;
  const HI_KEY = 'snake_hi';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const scoreEl  = document.getElementById('score');
  const levelEl  = document.getElementById('level');
  const bestEl   = document.getElementById('best');
  const finalEl  = document.getElementById('final-score');
  const subEl    = document.getElementById('gameover-sub');
  const startOv  = document.getElementById('overlay-start');
  const gameoverOv = document.getElementById('overlay-gameover');

  let snake, dir, nextDir, food, score, level, pellets, tickTimer, running;

  function loadBest() {
    return parseInt(localStorage.getItem(HI_KEY) || '0', 10);
  }
  function saveBest(s) {
    if (s > loadBest()) localStorage.setItem(HI_KEY, String(s));
  }

  function rndCell() {
    return { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  }

  function spawnFood() {
    let pos;
    do { pos = rndCell(); } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function initGame() {
    const mid = Math.floor(COLS / 2);
    snake = [
      { x: mid,   y: Math.floor(ROWS / 2) },
      { x: mid-1, y: Math.floor(ROWS / 2) },
      { x: mid-2, y: Math.floor(ROWS / 2) },
    ];
    dir     = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score   = 0;
    level   = 1;
    pellets = 0;
    spawnFood();
    updateUI();
    draw();
  }

  function updateUI() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    bestEl.textContent  = loadBest();
  }

  function tick() {
    dir = nextDir;
    const head = { x: (snake[0].x + dir.x + COLS) % COLS,
                   y: (snake[0].y + dir.y + ROWS) % ROWS };

    // Self collision (walls wrap, so no wall collision)
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      // Ate food
      pellets++;
      score += level * 10;
      level = Math.floor(pellets / PELLETS_PER_LEVEL) + 1;
      spawnFood();
      updateUI();
      // Schedule next tick at new speed
      clearInterval(tickTimer);
      tickTimer = setInterval(tick, Math.max(50, INITIAL_INTERVAL - (level - 1) * SPEED_STEP));
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background grid
    ctx.fillStyle = '#1a1d2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid lines (subtle)
    ctx.strokeStyle = '#2e315420';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ROWS*CELL); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(COLS*CELL,y*CELL); ctx.stroke();
    }

    // Food
    const fx = food.x * CELL + CELL/2, fy = food.y * CELL + CELL/2, fr = CELL/2 - 2;
    ctx.beginPath();
    ctx.arc(fx, fy, fr, 0, Math.PI * 2);
    ctx.fillStyle = '#ff6584';
    ctx.fill();
    // Shine
    ctx.beginPath();
    ctx.arc(fx - fr*0.3, fy - fr*0.3, fr*0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fill();

    // Snake
    snake.forEach((seg, i) => {
      const isHead = i === 0;
      const t = 1 - (i / snake.length) * 0.5; // fade tail
      const r = CELL / 2 - 1;
      const cx2 = seg.x * CELL + CELL/2, cy2 = seg.y * CELL + CELL/2;

      ctx.beginPath();
      ctx.roundRect(seg.x*CELL+1, seg.y*CELL+1, CELL-2, CELL-2, isHead ? 5 : 3);
      if (isHead) {
        ctx.fillStyle = '#43d98c';
      } else {
        const g = Math.round(t * 155 + 100);
        ctx.fillStyle = `rgb(20,${g},80)`;
      }
      ctx.fill();

      if (isHead) {
        // Eyes
        const eyeOffset = dir.x !== 0 ? { ex: dir.x * 3, ey: 3 } : { ex: 3, ey: dir.y * 3 };
        [-1,1].forEach(side => {
          ctx.beginPath();
          const ex = cx2 + eyeOffset.ex + (dir.x === 0 ? side * eyeOffset.ex : 0);
          const ey = cy2 + eyeOffset.ey + (dir.y === 0 ? side * eyeOffset.ey : 0);
          ctx.arc(ex, ey, 2, 0, Math.PI * 2);
          ctx.fillStyle = '#0f1117';
          ctx.fill();
        });
      }
    });
  }

  function startGame() {
    startOv.classList.add('hidden');
    gameoverOv.classList.add('hidden');
    initGame();
    running = true;
    tickTimer = setInterval(tick, INITIAL_INTERVAL);
  }

  function endGame() {
    clearInterval(tickTimer);
    running = false;
    saveBest(score);
    finalEl.textContent = score + ' pts';
    const best = loadBest();
    subEl.textContent = score >= best && score > 0
      ? 'New best score!'
      : 'Best: ' + best + ' pts';
    gameoverOv.classList.remove('hidden');
    updateUI();
  }

  // Input
  const DIRS = {
    ArrowUp:    { x:0, y:-1 }, ArrowDown:  { x:0, y:1 },
    ArrowLeft:  { x:-1,y:0 },  ArrowRight: { x:1, y:0 },
    w: { x:0,y:-1 }, s: { x:0,y:1 }, a: { x:-1,y:0 }, d: { x:1,y:0 },
    W: { x:0,y:-1 }, S: { x:0,y:1 }, A: { x:-1,y:0 }, D: { x:1,y:0 },
  };

  document.addEventListener('keydown', e => {
    if (!running) return;
    const d = DIRS[e.key];
    if (!d) return;
    e.preventDefault();
    // Prevent reversing
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  });

  // Touch/swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', e => { e.preventDefault(); touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: false });
  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    if (!running || !touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    let d;
    if (Math.abs(dx) > Math.abs(dy)) {
      d = dx > 0 ? { x:1,y:0 } : { x:-1,y:0 };
    } else {
      d = dy > 0 ? { x:0,y:1 } : { x:0,y:-1 };
    }
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
    touchStart = null;
  }, { passive: false });

  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-replay').addEventListener('click', startGame);

  // Init display
  bestEl.textContent = loadBest();
  initGame();

  // Keep the whole board on screen: shrink it to fit the viewport height on short screens.
  function fitBoard() {
    var wrap = document.getElementById('canvas-wrap');
    if (!wrap) return;
    var availW = (wrap.parentNode && wrap.parentNode.clientWidth) || window.innerWidth;
    var top = wrap.getBoundingClientRect().top;
    var availH = window.innerHeight - top - 40;
    var size = Math.max(150, Math.min(500, availW, availH));
    wrap.style.maxWidth = size + 'px';
  }
  window.addEventListener('resize', fitBoard);
  window.addEventListener('orientationchange', function () { setTimeout(fitBoard, 250); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fitBoard);
  fitBoard();

  // roundRect polyfill for older browsers
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      r = Math.min(r, w/2, h/2);
      this.moveTo(x+r,y); this.lineTo(x+w-r,y);
      this.arcTo(x+w,y,x+w,y+r,r); this.lineTo(x+w,y+h-r);
      this.arcTo(x+w,y+h,x+w-r,y+h,r); this.lineTo(x+r,y+h);
      this.arcTo(x,y+h,x,y+h-r,r); this.lineTo(x,y+r);
      this.arcTo(x,y,x+r,y,r); this.closePath();
    };
  }
  </script>
</body>
</html>
